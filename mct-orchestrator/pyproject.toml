[project]
name = "mct-orchestrator"
version = "0.2.0"
description = "Fail-closed MCP orchestrator with SHB routing and hotspot/backoffice trust boundary"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "requests>=2.31",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
